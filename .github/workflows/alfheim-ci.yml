name: Alfheim fork CI

permissions: read-all

on:
  push:
    branches:
      - 'alfheim/v*'
  pull_request:
    branches:
      - 'alfheim/v*'
  workflow_dispatch:

jobs:
  verify:
    name: Verify patched release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify official release base
        shell: bash
        run: |
          set -euo pipefail
          upstream_tag="$(tr -d '[:space:]' < .alfheim/upstream-release)"
          git fetch --force https://github.com/ChromeDevTools/chrome-devtools-mcp.git \
            "refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"
          git merge-base --is-ancestor "${upstream_tag}" HEAD

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Install browser
        run: npx puppeteer browsers install chrome

      - name: Disable AppArmor
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Check formatting
        run: npm run check-format

      - name: Run complete test suite
        run: npm run test
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
